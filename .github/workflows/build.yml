name: Easypass build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install Tauri Linux build deps & UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            libfuse2 \
            libglib2.0-0 \
            libarchive-tools \
            zstd \
            patchelf \
            squashfs-tools \
            xz-utils \
            upx-ucl

      - name: Build & package
        run: npm run tauri build --verbose

      - name: List build outputs for debugging
        run: |
          echo "=== src-tauri/target/release ==="
          ls -la src-tauri/target/release || true
          echo "=== bundle dir ==="
          ls -la src-tauri/target/release/build || true

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: easypass-tauri-bundles
          path: |
            src-tauri/target/release/easypass
            src-tauri/target/release/bundle/appimage/**/*.AppImage
