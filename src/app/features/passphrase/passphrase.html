<div class="flex flex-col gap-2 w-full text-sm">
    <div class="grid grid-cols-2 gap-3">
        <label
            class="flex items-center gap-2"
            title="{{ i18n.t('info.passphrase.dictEnglish') }}">
            <input type="checkbox" [(ngModel)]="dict_english" />
            <span>{{ i18n.t('labels.passphrase.dictEnglish') }}</span>
        </label>
        <label
            class="flex items-center gap-2"
            title="{{ i18n.t('info.passphrase.dictSpanish') }}">
            <input type="checkbox" [(ngModel)]="dict_spanish" />
            <span>{{ i18n.t('labels.passphrase.dictSpanish') }}</span>
        </label>
    </div>
	<div class="flex items-center justify-between mt-6">
		<label class="font-medium">{{ i18n.t('labels.passphrase.words') }}</label>
		<span class="text-xs text-gray-500">{{ words }}</span>
	</div>
	<input type="range" min="2" max="8" [(ngModel)]="words" class="w-full" />

	<div class="grid grid-cols-2 gap-3 mt-2 items-center">
		<div>
			<label class="font-medium text-sm" title="{{ i18n.t('info.passphrase.minLength') }}">{{ i18n.t('labels.passphrase.minLength') }}</label>
			<input type="number" min="3" max="10" [(ngModel)]="min_length" class="w-full border rounded px-2 py-1 text-sm mt-1" />
		</div>
		<div>
			<label class="font-medium text-sm" title="{{ i18n.t('info.passphrase.maxLength') }}">{{ i18n.t('labels.passphrase.maxLength') }}</label>
			<input type="number" min="3" max="10" [(ngModel)]="max_length" class="w-full border rounded px-2 py-1 text-sm mt-1" />
		</div>
	</div>

	<div class="grid grid-cols-2 gap-3 mt-2">
		<div>
			<label class="font-medium text-sm" title="{{ i18n.t('info.passphrase.separator') }}">{{ i18n.t('labels.passphrase.separator') }}</label>
			<input type="text" placeholder="{{ i18n.t('placeholders.separator') }}" [(ngModel)]="separator" class="w-full border rounded px-2 py-1 text-sm mt-1" />
		</div>
		<div class="flex items-center justify-center">
			<label
				class="flex items-center gap-2 mt-5"
				title="{{ i18n.t('info.passphrase.salt') }}"
				><input type="checkbox" [(ngModel)]="salt" />
				<span>{{ i18n.t('labels.passphrase.salt') }}</span>
			</label>
		</div>
	</div>

	<div class="flex gap-2 mt-3">
		<button (click)="generate()" class="bg-blue-600 text-white px-3 py-1.5 rounded flex items-center gap-2 hover:bg-blue-700 transition-colors">
			<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>
			<span>{{ i18n.t('buttons.generate') }}</span>
		</button>

		<button (click)="copyToClipboard()" class="bg-gray-200 px-3 py-1.5 rounded flex items-center gap-2 hover:bg-gray-300 transition-colors">
			<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7m0 2.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667z"/><path d="M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1"/></svg>
			<span>{{ i18n.t('buttons.copy') }}</span>
		</button>
	</div>

	<div class="mt-3">
		<label class="font-medium">{{ i18n.t('labels.result') }}</label>
		<input type="text" readonly [value]="result?.passphrase" (click)="$event.target.select()" class="w-full border rounded px-3 py-2 mt-1 bg-gray-50 text-sm" />
	</div>

	@if (result !== undefined) {
	<div class="mt-3">
		<div class="flex items-center justify-between mb-1">
			<label title="{{ i18n.t('info.passphrase.security') }}" class="font-medium text-sm">{{ i18n.t('labels.security') }}</label>
		</div>
		<div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
			<div class="h-full transition-all duration-300" [style.width.%]="(result?.strength ?? 0)" [ngClass]="{
					'bg-red-800': (result?.strength ?? 0) < 10,
					'bg-red-600': (result?.strength ?? 0) >= 10 && (result?.strength ?? 0) < 20,
					'bg-orange-500': (result?.strength ?? 0) >= 20 && (result?.strength ?? 0) < 30,
					'bg-yellow-600': (result?.strength ?? 0) >= 30 && (result?.strength ?? 0) < 40,
					'bg-yellow-400': (result?.strength ?? 0) >= 40 && (result?.strength ?? 0) < 50,
					'bg-lime-400': (result?.strength ?? 0) >= 50 && (result?.strength ?? 0) < 60,
					'bg-lime-500': (result?.strength ?? 0) >= 60 && (result?.strength ?? 0) < 70,
					'bg-green-400': (result?.strength ?? 0) >= 70 && (result?.strength ?? 0) < 80,
					'bg-green-500': (result?.strength ?? 0) >= 80 && (result?.strength ?? 0) < 90,
					'bg-emerald-400': (result?.strength ?? 0) >= 90 && (result?.strength ?? 0) < 100,
					'bg-emerald-600': (result?.strength ?? 0) >= 100
				}">
			</div>
		</div>
		<div class="flex justify-between text-xs text-gray-500 mt-1">
			<span>{{ i18n.t('labels.weak') }}</span>
			<span>{{ i18n.t('labels.strong') }}</span>
		</div>
	</div>
	}

	@if (showToast) {
	<div class="fixed bottom-4 right-4 bg-black text-white px-3 py-2 rounded shadow-md z-50 text-sm">
		{{ toastMessage }}
	</div>
	}
</div>
