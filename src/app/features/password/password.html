<div class="flex flex-col gap-2 w-full text-sm">
  <div class="flex items-center justify-between">
    <label class="font-medium">{{ i18n.t('labels.password.length') }}</label>
    <span class="text-xs text-gray-500">{{ length }}</span>
  </div>
  <input type="range" min="6" max="32" [(ngModel)]="length" class="w-full" />

  <div class="grid grid-cols-2 gap-3">
    <label
      class="flex items-center gap-2"
      title="{{ i18n.t('info.password.lowercase') }}"
      ><input type="checkbox" [(ngModel)]="useLowercase" />
      <span>{{ i18n.t('labels.password.lowercase') }}</span></label
    >
    <label
      class="flex items-center gap-2"
      title="{{ i18n.t('info.password.uppercase') }}"
      ><input type="checkbox" [(ngModel)]="useUppercase" />
      <span>{{ i18n.t('labels.password.uppercase') }}</span></label
    >
    <label
      class="flex items-center gap-2"
      title="{{ i18n.t('info.password.numbers') }}"
      ><input type="checkbox" [(ngModel)]="useNumbers" />
      <span>{{ i18n.t('labels.password.numbers') }}</span></label
    >
    <label
      class="flex items-center gap-2"
      title="{{ i18n.t('info.password.symbols') }}"
      ><input type="checkbox" [(ngModel)]="useSymbols" />
      <span>{{ i18n.t('labels.password.symbols') }}</span></label
    >
  </div>

  <label
    class="flex items-center gap-2 mt-1"
    title="{{ i18n.t('info.password.others') }}"
    ><input type="checkbox" [(ngModel)]="useOthers" />
    <span class="mr-2">{{ i18n.t('labels.password.others') }}</span></label
  >

  @if (useOthers) {
  <input
    type="text"
    [(ngModel)]="others"
    placeholder="e.g. ±€"
    class="border rounded px-2 py-1 mt-1 text-sm"
  />
  }

  <div class="flex gap-2 mt-2">
    <div class="relative inline-flex">
      <button
        (click)="generate()"
        class="bg-blue-600 text-white px-3 py-1.5 rounded-l flex items-center gap-2 hover:bg-blue-700 transition-colors"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="#000000"
          stroke-width="1"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
          <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
        </svg>

      <span>{{ i18n.t('buttons.generate') }}</span>
      </button>

      <button
        (click)="toggleEntropyMenu()"
        class="bg-blue-600 text-white px-2 rounded-r hover:bg-blue-700 transition-colors"
        aria-haspopup="true"
        [attr.aria-expanded]="entropyMenuOpen"
        title="Generate options"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>

      @if (entropyMenuOpen) {
      <div class="absolute left-0 mt-2 bg-white border rounded shadow-md p-0 z-50 w-56 text-sm">
        <button
          (click)="openEntropyModal()"
          class="w-full px-3 py-2 text-left hover:bg-gray-100 rounded"
        >
          {{ i18n.t('buttons.generateEntropy') }}
        </button>
      </div>
      }
    </div>
    <button
      (click)="copyToClipboard()"
      class="bg-gray-200 px-3 py-1.5 rounded flex items-center gap-2 hover:bg-gray-300 transition-colors"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#000000"
        stroke-width="1"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M7 7m0 2.667a2.667 2.667 0 0 1 2.667 -2.667h8.666a2.667 2.667 0 0 1 2.667 2.667v8.666a2.667 2.667 0 0 1 -2.667 2.667h-8.666a2.667 2.667 0 0 1 -2.667 -2.667z"
        />
        <path
          d="M4.012 16.737a2.005 2.005 0 0 1 -1.012 -1.737v-10c0 -1.1 .9 -2 2 -2h10c.75 0 1.158 .385 1.5 1"
        />
      </svg>

      <span>{{ i18n.t('buttons.copy') }}</span>
    </button>
  </div>

  <div class="mt-3">
    <label class="font-medium">{{ i18n.t('labels.result') }}</label>
    <input
      type="text"
      readonly
      [value]="result"
      (click)="$event.target.select()"
      class="w-full border rounded px-3 py-2 mt-1 bg-gray-50 text-sm"
    />
  </div>

  @if (entropyModalOpen) {
  <div class="fixed inset-0 bg-black/40 z-60 flex items-center justify-center" (click)="cancelEntropyModal()">
    <div class="bg-white rounded shadow-lg p-4 w-96" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-labelledby="entropyTitle" (keydown.escape)="cancelEntropyModal()">
      <h3 id="entropyTitle" class="text-lg font-semibold mb-2">{{ i18n.t('modals.entropy.title') }}</h3>
      <p class="text-sm text-gray-600 mb-3">{{ i18n.t('modals.entropy.desc') }}</p>
      <input id="entropyInput" type="text" [(ngModel)]="entropyText" placeholder="{{ i18n.t('modals.entropy.placeholder') }}" class="border rounded px-2 py-2 w-full mb-3" />
      <div class="flex justify-end gap-2">
        <button (click)="cancelEntropyModal()" class="px-3 py-1 rounded bg-gray-200">{{ i18n.t('modals.entropy.cancel') }}</button>
        <button (click)="confirmEntropy()" class="px-3 py-1 rounded bg-blue-600 text-white">{{ i18n.t('modals.entropy.ok') }}</button>
      </div>
    </div>
  </div>
  }

  @if (showToast) {
  <div
    class="fixed bottom-4 right-4 bg-black text-white px-3 py-2 rounded shadow-md z-50 text-sm"
  >
    {{ toastMessage }}
  </div>
  }
</div>
