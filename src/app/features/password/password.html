<div class="flex flex-col gap-2 w-full text-sm">
	<div class="flex items-center justify-between">
		<label class="font-medium">{{ i18n.t('labels.password.length') }}</label>
		<span class="text-xs text-gray-500">{{ length }}</span>
	</div>
	<input type="range" min="6" max="32" [(ngModel)]="length" class="w-full" />

	<div class="grid grid-cols-2 gap-3">
		<label class="flex items-center gap-2" title="{{ i18n.t('info.password.lowercase') }}"><input type="checkbox" [(ngModel)]="useLowercase" /> <span>{{ i18n.t('labels.password.lowercase') }}</span></label>
		<label class="flex items-center gap-2" title="{{ i18n.t('info.password.uppercase') }}"><input type="checkbox" [(ngModel)]="useUppercase" /> <span>{{ i18n.t('labels.password.uppercase') }}</span></label>
		<label class="flex items-center gap-2" title="{{ i18n.t('info.password.numbers') }}"><input type="checkbox" [(ngModel)]="useNumbers" /> <span>{{ i18n.t('labels.password.numbers') }}</span></label>
		<label class="flex items-center gap-2" title="{{ i18n.t('info.password.symbols') }}"><input type="checkbox" [(ngModel)]="useSymbols" /> <span>{{ i18n.t('labels.password.symbols') }}</span></label>
	</div>

	<label class="flex items-center gap-2 mt-1" title="{{ i18n.t('info.password.others') }}"><input type="checkbox" [(ngModel)]="useOthers" /> <span class="mr-2">{{ i18n.t('labels.password.others') }}</span></label>
    
	@if (useOthers) {
		<input type="text" [(ngModel)]="others" placeholder="e.g. ±€" class="border rounded px-2 py-1 mt-1 text-sm" />
	}

	<div class="flex gap-2 mt-2">
		<button (click)="generate()" class="bg-blue-600 text-white px-3 py-1.5 rounded flex items-center gap-2 hover:bg-blue-700 transition-colors">
			<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 20 20" fill="currentColor"><path d="M2 5a2 2 0 012-2h6a2 2 0 012 2v1h-1V5H4v10h6v-1h1v1a2 2 0 01-2 2H4a2 2 0 01-2-2V5z"/></svg>
			<span>{{ i18n.t('buttons.generate') }}</span>
		</button>
		<button (click)="copyToClipboard()" class="bg-gray-200 px-3 py-1.5 rounded flex items-center gap-2 hover:bg-gray-300 transition-colors">
			<svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor"><path d="M19 21H9a2 2 0 01-2-2V7h2v12h10v2z"/><path d="M16 3h-8a2 2 0 00-2 2v12a2 2 0 002 2h8a2 2 0 002-2V5a2 2 0 00-2-2zm0 14H8V5h8v12z"/></svg>
			<span>{{ i18n.t('buttons.copy') }}</span>
		</button>
	</div>

	<div class="mt-3">
		<label class="font-medium">{{ i18n.t('labels.result') }}</label>
		<input type="text" readonly [value]="result" (click)="$event.target.select()" class="w-full border rounded px-3 py-2 mt-1 bg-gray-50 text-sm" />
	</div>

	@if (showToast) {
		<div class="fixed bottom-4 right-4 bg-black text-white px-3 py-2 rounded shadow-md z-50 text-sm">
			{{ toastMessage }}
		</div>
	}
</div>
